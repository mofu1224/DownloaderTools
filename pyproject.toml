[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "downloader-tools"
version = "0.1.0"
description = "永続キューを持つポータブル動画・画像ダウンローダー"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi", "uvicorn", "jinja2", "httpx", "portalocker", "psutil",
  "pillow", "pydantic", "tzdata",
  "pywin32; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "pyright", "playwright"]
engines = ["yt-dlp[default]", "gallery-dl"]

[project.scripts]
downloader-tools = "downloader_tools.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/downloader_tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
